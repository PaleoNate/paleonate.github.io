<div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Enlarged photograph">
  <button class="lb-close" aria-label="Close">&#10005;</button>
  <button class="lb-prev" aria-label="Previous photograph">&#8249;</button>
  <button class="lb-next" aria-label="Next photograph">&#8250;</button>
  <img alt="">
  <figcaption></figcaption>
  <div class="counter"></div>
</div>

<script>
(function () {
  var figs = [].slice.call(document.querySelectorAll('.gallery figure'));
  if (!figs.length) return;

  var box = document.querySelector('.lightbox');
  var img = box.querySelector('img');
  var cap = box.querySelector('figcaption');
  var num = box.querySelector('.counter');
  var i = 0, lastFocus = null;

  function show(n) {
    i = (n + figs.length) % figs.length;
    var f = figs[i];
    var source = f.querySelector('img');
    var caption = f.querySelector('figcaption');
    img.src = source.getAttribute('src');
    img.alt = source.getAttribute('alt') || '';
    cap.innerHTML = caption ? caption.innerHTML : '';
    num.textContent = (i + 1) + ' of ' + figs.length;
  }

  function openAt(n) {
    lastFocus = document.activeElement;
    show(n);
    box.setAttribute('open-state', 'on');
    box.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    box.querySelector('.lb-close').focus();
  }

  function close() {
    box.removeAttribute('open-state');
    box.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    img.removeAttribute('src');
    if (lastFocus) lastFocus.focus();
  }

  figs.forEach(function (f, n) {
    var t = f.querySelector('img');
    t.setAttribute('tabindex', '0');
    t.setAttribute('role', 'button');
    t.addEventListener('click', function () { openAt(n); });
    t.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAt(n); }
    });
  });

  box.querySelector('.lb-close').addEventListener('click', close);
  box.querySelector('.lb-prev').addEventListener('click', function (e) {
    e.stopPropagation(); show(i - 1);
  });
  box.querySelector('.lb-next').addEventListener('click', function (e) {
    e.stopPropagation(); show(i + 1);
  });
  box.addEventListener('click', function (e) {
    if (e.target === box || e.target === img) close();
  });
  document.addEventListener('keydown', function (e) {
    if (box.getAttribute('open-state') !== 'on') return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(i - 1);
    else if (e.key === 'ArrowRight') show(i + 1);
  });
})();
</script>
